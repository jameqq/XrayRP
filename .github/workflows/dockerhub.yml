name: Publish Docker Hub image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag
        required: true
        default: "20261105"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go for binary metadata verification
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.3"
          cache: false
      - name: Install Skopeo
        run: sudo apt-get update && sudo apt-get install -y skopeo
      - name: Verify new image and embedded core versions
        env:
          IMAGE_TAG: ${{ inputs.tag }}
        run: |
          image="ghcr.io/jameqq/xrayrp:$IMAGE_TAG"
          docker pull "$image"
          container=$(docker create "$image")
          docker cp "$container:/usr/local/bin/XrayR" /tmp/XrayR
          docker rm "$container"
          go version -m /tmp/XrayR | tee /tmp/xrayrp-buildinfo
          grep -F 'v1.260327.1-0.20261031132019-a4a3dff5b20c' /tmp/xrayrp-buildinfo
          grep -F 'v0.0.0-20261014101318-83f621788ca8' /tmp/xrayrp-buildinfo
          grep -F 'github.com/sagernet/sing-box' /tmp/xrayrp-buildinfo | grep -F 'v1.14.2'
          grep -F 'github.com/apernet/hysteria/core/v2' /tmp/xrayrp-buildinfo | grep -F 'v2.12.3'
          docker run --rm --entrypoint XrayR "$image" version
      - name: Copy verified multi-architecture image to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          IMAGE_TAG: ${{ inputs.tag }}
        run: |
          printf '%s' "$DOCKERHUB_TOKEN" | skopeo login --username "$DOCKERHUB_USERNAME" --password-stdin docker.io
          skopeo copy --all --preserve-digests \
            "docker://ghcr.io/jameqq/xrayrp:$IMAGE_TAG" \
            "docker://docker.io/jamqi20/xray2023:$IMAGE_TAG"
          source_digest=$(skopeo inspect --format '{{.Digest}}' "docker://ghcr.io/jameqq/xrayrp:$IMAGE_TAG")
          target_digest=$(skopeo inspect --format '{{.Digest}}' "docker://docker.io/jamqi20/xray2023:$IMAGE_TAG")
          test "$source_digest" = "$target_digest"
          skopeo inspect --raw "docker://docker.io/jamqi20/xray2023:$IMAGE_TAG" | jq '.manifests[].platform'
